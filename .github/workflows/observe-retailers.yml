name: Observe Japanese Plakoro retailers

on:
  push:
    branches: [main]
    paths:
      - 'catalog/product_watchlist.json'
      - 'scripts/observe_products.py'
      - 'scripts/product_status.py'
      - 'tests/test_observe_products.py'
      - '.github/workflows/observe-retailers.yml'
  schedule:
    - cron: '11 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test product stock classification
        run: python -m unittest discover -s tests -p 'test_product_status.py' -v
      - name: Test conservative Japanese stock signals
        run: python -m unittest discover -s tests -p 'test_sale_status.py' -v
      - name: Test product-page observation safeguards
        run: python -m unittest discover -s tests -p 'test_observe_products.py' -v
      - name: Observe verified product pages
        run: python -m scripts.observe_products
      - name: Check Japanese retailer listings
        run: python scripts/observe_retailers.py
      - name: Upload observations for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retailer-observations
          path: |
            catalog/retailer_observations.json
            catalog/product_observations.json
          retention-days: 14
