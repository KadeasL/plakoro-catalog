name: Collect Plakoro candidates

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Russian localization
        run: python -m unittest discover -s tests -v
      - name: Collect candidates
        run: python scripts/collect.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plakoro-candidates
          path: candidates.json
          if-no-files-found: warn
          retention-days: 30
